name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m py_compile bot.py i18n.py
      - name: Run tests
        env:
          TELEGRAM_TOKEN: ci-token
          TELEGRAM_CHAT_ID: "1"
        run: python -m pytest tests/ -q
